name: Build dungeons_bridge.dll

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: cmd
        run: |
          cl /LD /EHsc /std:c++17 /O2 dungeons_bridge.cpp /I. /link LibMinHook.x64.lib d3d11.lib dxgi.lib user32.lib gdi32.lib /OUT:dungeons_bridge.dll

      - uses: actions/upload-artifact@v4
        with:
          name: dungeons_bridge
          path: dungeons_bridge.dll
